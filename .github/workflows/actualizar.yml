name: Actualizar Araba

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-empleo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar lector de PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Leer siguiente boletín de Araba
        run: node scripts/actualizar_araba.mjs

      - name: Guardar datos nuevos
        run: |
          git add web_empleo.sqlite data/convocatorias.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar boletín de Araba"
          git push

      - name: Preparar archivos de la web
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir web
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
